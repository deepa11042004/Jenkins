name: Deploy Jenkins to AWS

on:
  push:
    branches: [main]
    paths:
      - "cloudformation/**"
      - "docker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  STACK_NAME: jenkins

jobs:
  deploy:
    name: CloudFormation deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/jenkins-stack.yaml

      - name: Discover default VPC + subnet
        id: net
        run: |
          VPC_ID=$(aws ec2 describe-vpcs --filters Name=is-default,Values=true --query 'Vpcs[0].VpcId' --output text)
          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "No default VPC found in this account/region — pass VpcId/SubnetId manually instead." >&2
            exit 1
          fi
          SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${VPC_ID}" --query 'Subnets[0].SubnetId' --output text)
          echo "vpc_id=${VPC_ID}" >> "$GITHUB_OUTPUT"
          echo "subnet_id=${SUBNET_ID}" >> "$GITHUB_OUTPUT"

      - name: Build and push custom Jenkins image
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME not set — deploying the public jenkins/jenkins image instead."
            echo "image=jenkins/jenkins:lts-jdk17" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

          # Content-hash tag: only changes (and so only forces an EC2
          # instance replacement) when Dockerfile/plugins.txt actually
          # change, not on every unrelated push to this repo.
          TAG=$(cat docker/Dockerfile docker/plugins.txt | sha256sum | cut -c1-12)
          IMAGE="${DOCKERHUB_USERNAME}/jenkins-deployment"

          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" docker/
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Clean up a stuck failed stack, if any
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "Current stack status: ${STATUS}"
          case "$STATUS" in
            ROLLBACK_COMPLETE|CREATE_FAILED|DELETE_FAILED)
              echo "Stack is stuck in ${STATUS} and can't be updated in place — deleting it first."
              aws cloudformation delete-stack --stack-name "${STACK_NAME}"
              aws cloudformation wait stack-delete-complete --stack-name "${STACK_NAME}"
              ;;
          esac

      - name: Deploy stack
        env:
          JENKINS_ADMIN_CIDR: ${{ secrets.JENKINS_ADMIN_CIDR }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # An unset secret comes through as "" rather than truly unset —
          # fall back explicitly so that doesn't override the template's
          # default with an invalid empty CIDR.
          CIDR="${JENKINS_ADMIN_CIDR:-0.0.0.0/0}"
          aws cloudformation deploy \
            --stack-name "${STACK_NAME}" \
            --template-file cloudformation/jenkins-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              VpcId=${{ steps.net.outputs.vpc_id }} \
              SubnetId=${{ steps.net.outputs.subnet_id }} \
              JenkinsAdminCidr="${CIDR}" \
              DockerHubUsername="${DOCKERHUB_USERNAME}" \
              DockerHubToken="${DOCKERHUB_TOKEN}" \
              JenkinsDockerImage="${{ steps.image.outputs.image }}" \
              InstanceType="t3.small"

      - name: Show Jenkins URL
        run: |
          aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs" --output table
