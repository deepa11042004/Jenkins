name: Destroy Jenkins AWS Infra

# Manual-only, guarded by a typed confirmation. This tears down real
# infra (EC2, EBS, EIP) — never triggers on push.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm you want to tear down the Jenkins stack'
        required: true

permissions:
  contents: read

env:
  STACK_NAME: jenkins

jobs:
  destroy:
    name: CloudFormation delete stack
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Delete stack
        run: |
          aws cloudformation delete-stack --stack-name "${STACK_NAME}"
          aws cloudformation wait stack-delete-complete --stack-name "${STACK_NAME}"
