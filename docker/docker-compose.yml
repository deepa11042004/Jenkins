# Local testing for the same image the deploy workflow builds from
# Dockerfile + plugins.txt and pushes to Docker Hub. Not used by AWS —
# cloudformation/jenkins-stack.yaml embeds its own copy of this in
# UserData, pointed at whatever image the workflow just pushed.
#
#   docker compose up -d --build
#   open http://localhost:8080

services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Uncomment to let Jenkins build/run Docker images from pipelines
      # (Docker-in-Docker via the host socket):
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true

volumes:
  jenkins_home:
