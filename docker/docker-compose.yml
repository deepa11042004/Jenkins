# Reference copy of what infra/user_data.sh deploys to the EC2 instance.
# Not used directly by Terraform (user_data.sh writes its own copy on the
# server), but handy for running Jenkins locally to test before you push.
#
#   docker compose up -d
#   open http://localhost:8080

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Uncomment to let Jenkins build/run Docker images from pipelines
      # (Docker-in-Docker via the host socket):
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true

volumes:
  jenkins_home:
